{% extends "base.html" %}
{% block title %}Your profile{% endblock %}
{% block content %}
<h1>Your profile</h1>
<dl class="profile">
  <dt>Name</dt><dd>{{ user.full_name }}</dd>
  <dt>Email</dt><dd>{{ user.email }}</dd>
  <dt>Member since</dt><dd>{{ user.created_at }}</dd>
</dl>
<p class="muted">Order history arrives in a later stage.</p>
{% endblock %}
