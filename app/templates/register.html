{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Create an account</h1>
  {% for message in errors %}<div class="alert error">{{ message }}</div>{% endfor %}
  <form method="post" action="{{ url_for('auth.register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" type="text" value="{{ full_name }}" maxlength="100" autocomplete="name" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" maxlength="254" autocomplete="username" required>
    <label for="password">Password (10 to 128 characters)</label>
    <input id="password" name="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required>
    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" name="confirm_password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required>
    <button type="submit">Register</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>.</p>
  <p class="muted">Use fictional data only. This is a local workshop app.</p>
</section>
{% endblock %}
