{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Log in</h1>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" maxlength="254" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
    <button type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a>.</p>
</section>
{% endblock %}
