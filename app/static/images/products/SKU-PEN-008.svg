<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <radialGradient id="penBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="60%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </radialGradient>
    <linearGradient id="trayLining" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chromeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="penSoftShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#881337" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="500" height="380" rx="20" fill="url(#penBg)"/>

  <!-- Presentation Box Ground Shadow -->
  <ellipse cx="250" cy="325" rx="150" ry="22" fill="#be123c" opacity="0.25"/>
  <ellipse cx="250" cy="325" rx="100" ry="14" fill="#881337" opacity="0.18"/>

  <!-- Presentation Box / Pen Tray -->
  <g filter="url(#penSoftShadow)">
    <!-- Box Outer Shell -->
    <rect x="150" y="50" width="200" height="260" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Recessed Velvet Bed -->
    <rect x="158" y="58" width="184" height="244" rx="12" fill="url(#trayLining)"/>

    <!-- Pen 1: Stealth Black -->
    <g transform="translate(176, 75)">
      <!-- Pen Barrel -->
      <rect x="0" y="10" width="16" height="175" rx="5" fill="#334155"/>
      <rect x="1" y="30" width="14" height="40" rx="3" fill="#1e293b"/>
      <!-- Knurled Grip Bands -->
      <line x1="2" y1="150" x2="14" y2="150" stroke="#475569" stroke-width="1.5"/>
      <line x1="2" y1="156" x2="14" y2="156" stroke="#475569" stroke-width="1.5"/>
      <line x1="2" y1="162" x2="14" y2="162" stroke="#475569" stroke-width="1.5"/>
      <!-- Needle Point Nib -->
      <polygon points="3,185 8,198 13,185" fill="url(#chromeAccent)"/>
      <circle cx="8" cy="198" r="1.5" fill="#0f172a"/>
      <!-- Steel Pocket Clip -->
      <line x1="16" y1="20" x2="20" y2="55" stroke="url(#chromeAccent)" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Pen 2: Cobalt Indigo -->
    <g transform="translate(212, 70)">
      <!-- Pen Barrel -->
      <rect x="0" y="10" width="16" height="175" rx="5" fill="#2563eb"/>
      <rect x="1" y="30" width="14" height="40" rx="3" fill="#1d4ed8"/>
      <!-- Knurled Grip Bands -->
      <line x1="2" y1="150" x2="14" y2="150" stroke="#60a5fa" stroke-width="1.5"/>
      <line x1="2" y1="156" x2="14" y2="156" stroke="#60a5fa" stroke-width="1.5"/>
      <line x1="2" y1="162" x2="14" y2="162" stroke="#60a5fa" stroke-width="1.5"/>
      <!-- Needle Point Nib -->
      <polygon points="3,185 8,198 13,185" fill="url(#chromeAccent)"/>
      <circle cx="8" cy="198" r="1.5" fill="#1d4ed8"/>
      <!-- Steel Pocket Clip -->
      <line x1="16" y1="20" x2="20" y2="55" stroke="url(#chromeAccent)" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Pen 3: Crimson Red -->
    <g transform="translate(248, 73)">
      <!-- Pen Barrel -->
      <rect x="0" y="10" width="16" height="175" rx="5" fill="#e11d48"/>
      <rect x="1" y="30" width="14" height="40" rx="3" fill="#be123c"/>
      <!-- Knurled Grip Bands -->
      <line x1="2" y1="150" x2="14" y2="150" stroke="#fb7185" stroke-width="1.5"/>
      <line x1="2" y1="156" x2="14" y2="156" stroke="#fb7185" stroke-width="1.5"/>
      <line x1="2" y1="162" x2="14" y2="162" stroke="#fb7185" stroke-width="1.5"/>
      <!-- Needle Point Nib -->
      <polygon points="3,185 8,198 13,185" fill="url(#chromeAccent)"/>
      <circle cx="8" cy="198" r="1.5" fill="#be123c"/>
      <!-- Steel Pocket Clip -->
      <line x1="16" y1="20" x2="20" y2="55" stroke="url(#chromeAccent)" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Pen 4: Emerald Sage -->
    <g transform="translate(284, 75)">
      <!-- Pen Barrel -->
      <rect x="0" y="10" width="16" height="175" rx="5" fill="#059669"/>
      <rect x="1" y="30" width="14" height="40" rx="3" fill="#047857"/>
      <!-- Knurled Grip Bands -->
      <line x1="2" y1="150" x2="14" y2="150" stroke="#34d399" stroke-width="1.5"/>
      <line x1="2" y1="156" x2="14" y2="156" stroke="#34d399" stroke-width="1.5"/>
      <line x1="2" y1="162" x2="14" y2="162" stroke="#34d399" stroke-width="1.5"/>
      <!-- Needle Point Nib -->
      <polygon points="3,185 8,198 13,185" fill="url(#chromeAccent)"/>
      <circle cx="8" cy="198" r="1.5" fill="#047857"/>
      <!-- Steel Pocket Clip -->
      <line x1="16" y1="20" x2="20" y2="55" stroke="url(#chromeAccent)" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Hot-stamped Metallic Foil Badge -->
    <rect x="175" y="275" width="150" height="18" rx="4" fill="#1e293b"/>
    <text x="250" y="287" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#f43f5e" text-anchor="middle" letter-spacing="1.5">ARCHIVAL PRECISION GEL • 0.38MM</text>
  </g>
</svg>
