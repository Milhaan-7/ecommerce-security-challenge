<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <radialGradient id="bagGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="60%" stop-color="#f5f5f4"/>
      <stop offset="100%" stop-color="#e7e5e4"/>
    </radialGradient>
    <linearGradient id="canvasTexture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="40%" stop-color="#f4eee2"/>
      <stop offset="100%" stop-color="#e6dcce"/>
    </linearGradient>
    <filter id="bagDrop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#57534e" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="500" height="380" rx="20" fill="url(#bagGlow)"/>
  <ellipse cx="250" cy="325" rx="135" ry="18" fill="#a8a29e" opacity="0.35"/>

  <!-- Rear Webbing Straps -->
  <path d="M 210 160 C 210 40 290 40 290 160" fill="none" stroke="#78350f" stroke-width="15" stroke-linecap="round"/>
  <path d="M 210 160 C 210 40 290 40 290 160" fill="none" stroke="#92400e" stroke-width="9" stroke-linecap="round"/>

  <!-- Laptop Corner Peeking Out of Bag Top -->
  <g transform="translate(230, 85) rotate(10)">
    <rect x="0" y="0" width="95" height="110" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <rect x="4" y="4" width="87" height="102" rx="6" fill="#0f172a"/>
    <circle cx="47" cy="40" r="12" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Main Tote Bag Body with Shadow -->
  <g filter="url(#bagDrop)">
    <!-- Canvas Bag Shape -->
    <path d="M 175 140 L 325 140 L 315 295 C 315 315 185 315 185 295 Z" fill="url(#canvasTexture)" stroke="#d6c7b2" stroke-width="2.5"/>

    <!-- Realistic Fabric Grain Lines -->
    <path d="M 220 145 C 223 205 220 255 222 305" stroke="#d6c7b2" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 280 145 C 277 205 280 255 278 305" stroke="#d6c7b2" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Top Rim Reinforced Hem -->
    <rect x="173" y="138" width="154" height="14" rx="3" fill="#ebdcc8" stroke="#cbb89d" stroke-width="1.5"/>

    <!-- Front Webbing Straps -->
    <path d="M 210 190 L 210 138" stroke="#78350f" stroke-width="15" stroke-linecap="round"/>
    <path d="M 210 190 L 210 138" stroke="#92400e" stroke-width="9" stroke-linecap="round"/>
    <circle cx="210" cy="180" r="4" fill="#d97706"/>
    <circle cx="210" cy="180" r="2" fill="#78350f"/>

    <path d="M 290 190 L 290 138" stroke="#78350f" stroke-width="15" stroke-linecap="round"/>
    <path d="M 290 190 L 290 138" stroke="#92400e" stroke-width="9" stroke-linecap="round"/>
    <circle cx="290" cy="180" r="4" fill="#d97706"/>
    <circle cx="290" cy="180" r="2" fill="#78350f"/>

    <!-- Screenprinted Minimal Typography / Logo -->
    <g transform="translate(250, 230)">
      <rect x="-44" y="-18" width="88" height="42" rx="8" fill="#1c1917"/>
      <text x="0" y="0" font-family="ui-monospace, monospace" font-size="10.5" font-weight="900" fill="#f5f5f4" text-anchor="middle" letter-spacing="1.5">SEC_LAB</text>
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#a8a29e" text-anchor="middle" letter-spacing="2">EDC TOTE // 16OZ</text>
    </g>
  </g>
</svg>
