<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <radialGradient id="stkGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="60%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </radialGradient>
    <filter id="stickerDrop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="12" stdDeviation="14" flood-color="#1e3a8a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="500" height="380" rx="20" fill="url(#stkGlow)"/>
  <ellipse cx="250" cy="325" rx="140" ry="20" fill="#93c5fd" opacity="0.45"/>

  <!-- Sticker 1: Holographic Shield (Back Left) -->
  <g transform="translate(145, 90) rotate(-16)" filter="url(#stickerDrop)">
    <!-- White Die-Cut Vinyl Border -->
    <path d="M 60 10 L 110 25 C 110 85 60 115 60 115 C 60 115 10 85 10 25 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Metallic Gradient Shield -->
    <path d="M 60 15 L 105 28 C 105 82 60 108 60 108 C 60 108 15 82 15 28 Z" fill="#2563eb"/>
    <path d="M 60 15 L 105 28 C 105 82 60 108 60 108 Z" fill="#3b82f6"/>
    <!-- Lock Emblem -->
    <circle cx="60" cy="55" r="16" fill="#ffffff"/>
    <path d="M 54 54 L 58 59 L 68 47" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Sticker 2: Dark Terminal Console (Back Right) -->
  <g transform="translate(255, 110) rotate(14)" filter="url(#stickerDrop)">
    <rect x="0" y="0" width="125" height="100" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <rect x="6" y="6" width="113" height="88" rx="12" fill="#0f172a"/>
    <circle cx="20" cy="20" r="3.5" fill="#ef4444"/>
    <circle cx="30" cy="20" r="3.5" fill="#f59e0b"/>
    <circle cx="40" cy="20" r="3.5" fill="#10b981"/>
    <text x="16" y="48" font-family="ui-monospace, monospace" font-size="13" font-weight="bold" fill="#38bdf8">&gt;_ root#</text>
    <text x="16" y="68" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" fill="#4ade80">chmod 700</text>
    <text x="16" y="82" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">AUTHORIZED</text>
  </g>

  <!-- Sticker 3: Pixel Cyber Badge (Bottom Left) -->
  <g transform="translate(130, 185) rotate(-6)" filter="url(#stickerDrop)">
    <rect x="0" y="0" width="105" height="70" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <rect x="5" y="5" width="95" height="60" rx="10" fill="#7c3aed"/>
    <text x="52" y="32" font-family="ui-monospace, monospace" font-size="14" font-weight="900" fill="#fbcfe8" text-anchor="middle">0xDEAD</text>
    <text x="52" y="52" font-family="ui-monospace, monospace" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">BEEF_</text>
  </g>

  <!-- Sticker 4: Classic Yellow Debugger Duck (Front & Center) -->
  <g transform="translate(195, 160) rotate(3)" filter="url(#stickerDrop)">
    <circle cx="65" cy="65" r="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="5"/>
    <circle cx="65" cy="65" r="52" fill="#fbbf24"/>
    <ellipse cx="65" cy="72" rx="38" ry="30" fill="#f59e0b"/>
    <!-- Duck Eyes -->
    <ellipse cx="50" cy="54" rx="7" ry="8" fill="#0f172a"/>
    <circle cx="48" cy="52" r="2.5" fill="#ffffff"/>
    <ellipse cx="80" cy="54" rx="7" ry="8" fill="#0f172a"/>
    <circle cx="78" cy="52" r="2.5" fill="#ffffff"/>
    <!-- Beak -->
    <path d="M 58 64 Q 65 57 72 64 Q 65 80 58 64 Z" fill="#ea580c"/>
    <text x="65" y="105" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#78350f" text-anchor="middle" letter-spacing="1">QUACK_OPS</text>
  </g>
</svg>
