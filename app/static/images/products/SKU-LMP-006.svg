<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <radialGradient id="lampBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="55%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>
    <radialGradient id="deskLightBeam" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#fde047" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="anodizedMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brassJoint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="lampShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#78350f" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="500" height="380" rx="20" fill="url(#lampBg)"/>

  <!-- Light pool cast upon desk -->
  <ellipse cx="210" cy="315" rx="150" ry="32" fill="url(#deskLightBeam)"/>
  <ellipse cx="205" cy="315" rx="100" ry="18" fill="#fde68a" opacity="0.45"/>

  <!-- Lamp Base Ground Shadow -->
  <ellipse cx="325" cy="318" rx="60" ry="12" fill="#78350f" opacity="0.3"/>
  <ellipse cx="325" cy="318" rx="42" ry="8" fill="#451a03" opacity="0.2"/>

  <!-- Light Beam Cone -->
  <polygon points="215,108 90,315 320,315" fill="url(#deskLightBeam)" opacity="0.7"/>

  <!-- Lamp Hardware Structure -->
  <g filter="url(#lampShadow)">
    <!-- Base Plate -->
    <ellipse cx="325" cy="310" rx="48" ry="14" fill="#0f172a"/>
    <ellipse cx="325" cy="306" rx="46" ry="13" fill="#1e293b"/>
    <ellipse cx="325" cy="304" rx="42" ry="11" fill="url(#anodizedMetal)"/>

    <!-- Capacitive Touch Switch on Base -->
    <circle cx="310" cy="305" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="310" cy="305" r="2" fill="#38bdf8"/>

    <!-- Lower Cantilever Arm -->
    <line x1="325" y1="304" x2="295" y2="185" stroke="#0f172a" stroke-width="11" stroke-linecap="round"/>
    <line x1="325" y1="304" x2="295" y2="185" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

    <!-- Base Joint Pivot Pin -->
    <circle cx="325" cy="304" r="8" fill="url(#brassJoint)"/>
    <circle cx="325" cy="304" r="3" fill="#0f172a"/>

    <!-- Elbow Articulation Joint -->
    <circle cx="295" cy="185" r="11" fill="url(#brassJoint)"/>
    <circle cx="295" cy="185" r="5" fill="#1e293b"/>
    <rect x="290" y="172" width="10" height="26" rx="2" fill="url(#brassJoint)" transform="rotate(25, 295, 185)"/>

    <!-- Upper Cantilever Arm -->
    <line x1="295" y1="185" x2="235" y2="105" stroke="#0f172a" stroke-width="9" stroke-linecap="round"/>
    <line x1="295" y1="185" x2="235" y2="105" stroke="#334155" stroke-width="5" stroke-linecap="round"/>

    <!-- Head Swivel Joint -->
    <circle cx="235" cy="105" r="8" fill="url(#brassJoint)"/>
    <circle cx="235" cy="105" r="3" fill="#0f172a"/>

    <!-- Architectural Lamp Shade / Hood -->
    <path d="M 235 105 L 140 100 C 135 100 130 105 130 110 L 132 120 C 132 124 136 128 142 128 L 245 120 Z" fill="url(#anodizedMetal)"/>
    <path d="M 142 102 L 235 106" stroke="#475569" stroke-width="2"/>

    <!-- Diffused LED Glow Strip -->
    <polygon points="136,122 240,116 238,122 138,127" fill="#fef08a"/>
    <polygon points="140,123 236,118 235,121 141,125" fill="#ffffff"/>
  </g>
</svg>
