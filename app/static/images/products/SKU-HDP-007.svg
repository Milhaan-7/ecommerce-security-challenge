<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <radialGradient id="hdpBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <linearGradient id="brushedSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="headbandLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="earcupChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="hdpSoftShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="500" height="380" rx="20" fill="url(#hdpBg)"/>

  <!-- Grounding Desk Shadow -->
  <ellipse cx="250" cy="320" rx="140" ry="20" fill="#94a3b8" opacity="0.45"/>
  <ellipse cx="250" cy="320" rx="90" ry="12" fill="#64748b" opacity="0.25"/>

  <!-- Headphones Structure -->
  <g filter="url(#hdpSoftShadow)">
    <!-- Steel Dual-arch Headband Spring -->
    <path d="M 160 210 C 160 95 340 95 340 210" fill="none" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
    <path d="M 160 210 C 160 95 340 95 340 210" fill="none" stroke="url(#brushedSteel)" stroke-width="6" stroke-linecap="round"/>

    <!-- Padded Leather Comfort Cushion -->
    <path d="M 190 170 C 190 115 310 115 310 170" fill="none" stroke="url(#headbandLeather)" stroke-width="20" stroke-linecap="round"/>
    <!-- Cushion stitch lines -->
    <line x1="225" y1="120" x2="228" y2="138" stroke="#475569" stroke-width="2"/>
    <line x1="250" y1="117" x2="250" y2="136" stroke="#475569" stroke-width="2"/>
    <line x1="275" y1="120" x2="272" y2="138" stroke="#475569" stroke-width="2"/>

    <!-- Precision Extension Sliders with Calibration Marks -->
    <g transform="translate(155, 175)">
      <rect x="0" y="0" width="12" height="36" rx="3" fill="url(#brushedSteel)"/>
      <line x1="3" y1="8" x2="9" y2="8" stroke="#475569" stroke-width="1.5"/>
      <line x1="3" y1="14" x2="9" y2="14" stroke="#475569" stroke-width="1.5"/>
      <line x1="3" y1="20" x2="9" y2="20" stroke="#475569" stroke-width="1.5"/>
      <line x1="3" y1="26" x2="9" y2="26" stroke="#475569" stroke-width="1.5"/>
    </g>
    <g transform="translate(333, 175)">
      <rect x="0" y="0" width="12" height="36" rx="3" fill="url(#brushedSteel)"/>
      <line x1="3" y1="8" x2="9" y2="8" stroke="#475569" stroke-width="1.5"/>
      <line x1="3" y1="14" x2="9" y2="14" stroke="#475569" stroke-width="1.5"/>
      <line x1="3" y1="20" x2="9" y2="20" stroke="#475569" stroke-width="1.5"/>
      <line x1="3" y1="26" x2="9" y2="26" stroke="#475569" stroke-width="1.5"/>
    </g>

    <!-- Left Ear Cup (Yoke & Driver Housing) -->
    <g transform="translate(162, 230) rotate(10)">
      <!-- Aluminum Gimbal Fork -->
      <path d="M -16 -25 C -24 0 -24 35 -16 60" fill="none" stroke="url(#brushedSteel)" stroke-width="6" stroke-linecap="round"/>
      <!-- Soft Memory-Foam Leather Cushion -->
      <ellipse cx="6" cy="18" rx="28" ry="46" fill="#020617"/>
      <ellipse cx="6" cy="18" rx="20" ry="38" fill="#0f172a"/>
      <!-- Outer Acoustic Dome -->
      <ellipse cx="0" cy="18" rx="26" ry="44" fill="url(#earcupChassis)"/>
      <!-- Brushed Metal Center Emblem -->
      <circle cx="0" cy="18" r="14" fill="url(#brushedSteel)"/>
      <circle cx="0" cy="18" r="10" fill="#0f172a"/>
      <circle cx="0" cy="18" r="4" fill="#38bdf8"/>
    </g>

    <!-- Right Ear Cup (Yoke & Driver Housing) -->
    <g transform="translate(338, 230) rotate(-10)">
      <!-- Aluminum Gimbal Fork -->
      <path d="M 16 -25 C 24 0 24 35 16 60" fill="none" stroke="url(#brushedSteel)" stroke-width="6" stroke-linecap="round"/>
      <!-- Soft Memory-Foam Leather Cushion -->
      <ellipse cx="-6" cy="18" rx="28" ry="46" fill="#020617"/>
      <ellipse cx="-6" cy="18" rx="20" ry="38" fill="#0f172a"/>
      <!-- Outer Acoustic Dome -->
      <ellipse cx="0" cy="18" rx="26" ry="44" fill="url(#earcupChassis)"/>
      <!-- Brushed Metal Center Emblem -->
      <circle cx="0" cy="18" r="14" fill="url(#brushedSteel)"/>
      <circle cx="0" cy="18" r="10" fill="#0f172a"/>
      <circle cx="0" cy="18" r="4" fill="#38bdf8"/>
    </g>

    <!-- Coiled Studio Braided Audio Cable -->
    <path d="M 168 280 C 172 340 270 300 270 340 C 270 355 295 345 315 340" fill="none" stroke="#d97706" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Knurled Gold-Plated 3.5mm Jack -->
    <g transform="translate(315, 335) rotate(-15)">
      <rect x="0" y="0" width="18" height="8" rx="2" fill="#1e293b"/>
      <line x1="5" y1="1" x2="5" y2="7" stroke="#475569" stroke-width="1"/>
      <line x1="9" y1="1" x2="9" y2="7" stroke="#475569" stroke-width="1"/>
      <line x1="13" y1="1" x2="13" y2="7" stroke="#475569" stroke-width="1"/>
      <!-- Gold Connector Pins -->
      <rect x="18" y="2" width="14" height="4" rx="1" fill="#fcd34d"/>
      <line x1="22" y1="2" x2="22" y2="6" stroke="#0f172a" stroke-width="1"/>
      <line x1="27" y1="2" x2="27" y2="6" stroke="#0f172a" stroke-width="1"/>
    </g>
  </g>
</svg>
